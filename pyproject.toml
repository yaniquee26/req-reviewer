[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "req-reviewer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["requests", "openpyxl"]

[project.scripts]
req-reviewer = "req_reviewer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]